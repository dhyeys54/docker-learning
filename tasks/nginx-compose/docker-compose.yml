version: '1.0'
services:
  # web:
  #   image: nginx:latest
  #   ports:
  #     - 80:80
  #   volumes:
  #     - ./tasks/html-files:/usr/share/nginx/html

  pg:
    image: postgres:alpine
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    # env_file:
    #   - ./db-test1.env
    volumes:
      - pg_data:/var/lib/postgresql

  # alpine:
  #   image: alpine:latest
  #   stdin_open: true
  #   tty: true
  #   command: sh

  webapp:
    image: webserver-ruby
    build:
      context: ./../webserver-ruby
      dockerfile: Dockerfile
    depends_on:
      - pg
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_HOST
    # env_file:
    #   - ./db-test1.env
    #   - ./app-test1.env
    # ports:
    #   - 4567:4567
  
  lb:
    image: fangy54/lb:latest
    build:
      context: ./../nginx-loadbalancer
      dockerfile: dockerfile
    environment:
      - PROXY_PROTOCOL
      - PROXY_UPSTREAM
    ports:
      - 80:80

volumes:
  pg_data: